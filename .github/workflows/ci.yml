name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    # macos-15 runner images no longer preinstall SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build and Test
    # project.pbxproj is objectVersion 77, which requires Xcode 16+
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -project Hotbar.xcodeproj \
            -scheme Hotbar \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          xcodebuild test \
            -project Hotbar.xcodeproj \
            -scheme Hotbar \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
